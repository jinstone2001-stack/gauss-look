<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GaussLook</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/vendor/3Dmol-min.js"></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <b>Gauss<span>Look</span></b
        ><small>Gaussian 16 Analysis Studio · 1.1</small>
      </div>
      <div class="actions">
        <button id="uploadBtn">파일 열기</button
        ><button id="browseBtn">서버 폴더</button
        ><button id="demoBtn">데모</button
        ><button id="projectBtn">프로젝트 저장</button
        ><button id="refreshBtn">새로고침</button
        ><button id="cancelBtn">작업 취소</button
        ><button id="settingsBtn">설정</button
        ><button id="helpBtn">도움말</button>
      </div>
      <input type="file" id="upload" multiple hidden />
    </header>
    <main>
      <aside>
        <div class="section-title">PROJECT EXPLORER</div>
        <div id="jobs"></div>
        <div class="aside-note">
          .log · .out · .chk · .fchk<br />.cube · .gjf · .xyz · .sdf<br /><br />원본
          계산 결과와 편집 구조를 구별합니다.
        </div>
      </aside>
      <section class="workspace">
        <div id="status" role="status">파일을 열거나 데모를 선택하세요.</div>
        <div class="viewer-toolbar">
          <select id="style">
            <option value="ball">Ball & stick</option>
            <option value="stick">Sticks</option>
            <option value="line">Wireframe</option>
            <option value="sphere">Space filling</option></select
          ><label><input type="checkbox" id="labels" />번호</label
          ><label><input type="checkbox" id="hydrogens" checked />H</label
          ><button id="center">중심</button
          ><button id="clearSelection">선택 해제</button
          ><span id="selection"></span><button id="snapshot">PNG</button>
        </div>
        <div id="viewer"></div>
        <div class="timeline">
          <button id="play">▶ 경로</button
          ><input id="frame" type="range" min="0" max="0" value="0" /><span
            id="frameLabel"
            >0 / 0</span
          ><button id="xyzBtn">XYZ 저장</button>
        </div>
        <div class="plot-header">
          <b id="plotTitle">계산 경로 / 스펙트럼</b
          ><button id="plotCsv">CSV</button><button id="plotSvg">SVG</button>
        </div>
        <canvas id="plot"></canvas>
      </section>
      <section class="inspector">
        <nav id="tabs"></nav>
        <div id="panel"></div>
      </section>
    </main>
    <dialog id="modal">
      <div id="modalBody"></div>
      <button id="closeModal">닫기</button>
    </dialog>
    <script src="/core.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
