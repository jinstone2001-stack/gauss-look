name: tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q gausslook GaussLook.py
      - run: python -m pytest -q --ignore=tests/test_native_ui_v12.py --ignore=tests/test_native_ui_v13.py --ignore=tests/test_native_ui_v14.py
      - name: Install native UI test display
        if: matrix.python == '3.12'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Native Tk UI regressions
        if: matrix.python == '3.12'
        run: xvfb-run -a python -m pytest -q tests/test_native_ui_v12.py tests/test_native_ui_v13.py tests/test_native_ui_v14.py
      - uses: actions/setup-node@v4
        if: matrix.python == '3.12'
        with:
          node-version: '22'
      - name: Install DOM test dependency
        if: matrix.python == '3.12'
        run: npm install --prefix "$RUNNER_TEMP/gausslook-ui" jsdom@26.1.0
      - name: Web UI / real Python API (mock graphics)
        if: matrix.python == '3.12'
        run: NODE_PATH="$RUNNER_TEMP/gausslook-ui/node_modules" python tests/run_ui_dom.py
